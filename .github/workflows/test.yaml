name: Test worflow

on:
  workflow_dispatch:
    inputs:
      replicas:
        description: "Number of replicas"
        required: true
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Update replicas & commit
        run: |
          echo '${{ inputs.replicas }}' >> src/replicas
          git add src/replicas
          git status
          echo '${{ toJson(github.event.sender) }}'
          git config --global user.name '${{ github.event.sender.login }}'
          git config --global user.email '${{ github.event.sender.login }}@users.noreply.github.com'
          git commit -m '[bot] Scale replicas to ${{ inputs.replicas }}'
          git show
          
