name: Apps repo deploy
description: Updates apps-repo to deploy changes
inputs:
  apps:
    description: Multiline list of apps to deploy (cluster:namespace:app:version)
    required: true
  dryrun:
    description: Should run be a dryrun, and not commit any changes. (true/false)
    required: false
    default: "false"

  token:
    description: Optional STS token passed from caller. If set, no STS token will be fetched.
    required: false


runs:
  using: composite
  steps:
    - name: Fetch token if none provided in inputs
      if: ${{ inputs.token == '' }}
      id: octo-sts
      uses: octo-sts/action@v1.0.1
      with:
        scope: kartverket/heimdall-apps
        identity: heimdall

    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        repository: kartverket/heimdall-apps
        ref: main
        token: ${{ inputs.token || steps.octo-sts.outputs.token }}
        fetch-depth: 0
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Update versions
      shell: bash
      run: |
        set -euo pipefail
        # Install dependencies from repo root so shared packages (e.g. @actions/core) are available
        cd "${{ github.action_path }}/.."
        bun install --frozen-lockfile
        bun run apps-repo-deploy/src/index.ts
      env:
        INPUT_APPS: ${{ inputs.apps }}
        INPUT_DRYRUN: ${{ inputs.dryrun }}
