name: Apps repo deploy
description: Updates apps-repo to deploy changes
inputs:
  apps:
    description: Multiline list of apps to deploy (cluster:namespace:app:version)
    required: true
  dryrun:
    description: Should run be a dryrun, and not commit any changes. (true/false)
    required: false
    default: "false"

  identity:
    description: Identity to be used for fetching STS token
    required: false
    default: heimdall
  repository:
    description: Repository used as the STS token scope
    required: false
    default: kartverket/heimdall-apps

runs:
  using: composite
  steps:
    - name: Fetch STS token
      id: octo-sts
      uses: octo-sts/action@v1.0.1
      with:
        scope: ${{ inputs.repository }}
        identity: ${{ inputs.identity }}

    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: main
        token: ${{ steps.octo-sts.outputs.token }}
        fetch-depth: 0
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Update versions
      shell: bash
      run: |
        set -euo pipefail
        # Install dependencies from repo root so shared packages (e.g. @actions/core) are available
        cd "${{ github.action_path }}/.."
        bun install --frozen-lockfile
        bun run apps-repo-deploy/src/index.ts
      env:
        INPUT_APPS: ${{ inputs.apps }}
        INPUT_DRYRUN: ${{ inputs.dryrun }}
